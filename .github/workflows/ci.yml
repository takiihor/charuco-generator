name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    # Every pinned wheel exists on all three platforms for 3.11-3.13 (OpenCV ships cp37-abi3).
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 3.11 is the supported floor, 3.12 the version the shipped artifacts were generated with.
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check
      # Without Poppler the vector-PDF rasterization test silently skips, so the most direct
      # end-to-end print check would never run here. Windows keeps its skip.
      - name: Install Poppler (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Install Poppler (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install poppler
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy
      - name: Tests
        run: python -m pytest -q
      - name: Generate and re-verify a real board set and marker set
        run: |
          python generate.py generate --config config/boards.json --output-dir ci-output
          python generate.py verify --manifest ci-output/board_manifest.json
          python generate.py aruco --output-dir ci-markers
          python generate.py verify --manifest ci-markers/aruco_manifest.json
      - name: Keep print artifacts for review
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: ci-boards
          path: ci-output/

  package:
    # The metadata (dynamic version, py.typed, license) is only proven by an actual build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and install the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          python -m pip install dist/*.whl
          python -m pip check
      - name: Run the installed console script
        run: charuco-generator --version
