[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "precision-charuco-generator"
description = "ChArUco boards and standalone ArUco markers with actual-size vector PDFs and verified rasters"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
dynamic = ["dependencies", "version"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Manufacturing",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Image Processing",
]

[project.scripts]
charuco-generator = "charuco_generator.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
# Single source of truth for the version: charuco_generator.__version__.
version = {attr = "charuco_generator.__version__"}

[tool.setuptools.package-data]
charuco_generator = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = [".venv", ".pytest_cache", ".ruff_cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "C4", "SIM", "PIE", "RUF"]
# Size prompts deliberately accept the typographic multiplication sign as well as "x".
ignore = ["RUF001"]

[tool.mypy]
python_version = "3.11"
files = ["src/charuco_generator", "tests", "generate.py"]
ignore_missing_imports = true
warn_unused_ignores = true
