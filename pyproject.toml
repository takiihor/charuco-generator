[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "precision-charuco-generator"
version = "1.0.0"
description = "Reconstructible ChArUco boards with actual-size vector PDFs and verified raster outputs"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
charuco-generator = "charuco_generator.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
